[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pbl-auditguard"
version = "1.1.0"
description = "Explainable Kubernetes API credential abuse detection and reproducible evaluation"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
auditguard = "auditguard.cli:main"
auditguard-b5 = "auditguard.behavior:main"

[tool.setuptools]
packages = ["auditguard"]
